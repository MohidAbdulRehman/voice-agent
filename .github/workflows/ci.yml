name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.9"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check --diff .

  test:
    name: Tests (pytest + Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intake_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intake_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/intake_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  dashboard:
    name: Dashboard (typecheck, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build # includes tsc --noEmit

  smoke:
    # Runs the Docker image of the API through a transaction-mode PgBouncer on port
    # 6543, the same kind of pooler the Vercel deployment uses (Supabase's
    # transaction pooler). Prepared-statement support is off, the strictest case.
    name: API image smoke test via a transaction pooler (Dockerfile.api + scripts/smoke.sh)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intake_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intake_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      pooler:
        image: edoburu/pgbouncer:v1.25.2-p0
        env:
          DB_HOST: postgres
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: intake_test
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          MAX_PREPARED_STATEMENTS: "0"
          DEFAULT_POOL_SIZE: "2"
          LISTEN_PORT: "6543"
        ports:
          - 6543:6543
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/intake_test
      POOLER_URL: postgresql://postgres:postgres@localhost:6543/intake_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Migrate and seed the throwaway database
        run: |
          uv run python -m intake.db.migrate --test
          uv run python -m intake.db.seed --test
      - run: docker build --file Dockerfile.api --tag intake-api .
      - name: Start the API container behind the pooler
        run: |
          docker run --detach --name api --network host \
            --env DATABASE_URL="$POOLER_URL" --env PORT=8000 intake-api
          for _ in $(seq 1 30); do
            curl --silent --fail http://localhost:8000/health && exit 0
            sleep 1
          done
          exit 1
      - run: bash scripts/smoke.sh http://localhost:8000
      - name: A burst of parallel requests through the pooler
        run: |
          seq 1 60 | xargs -P 20 -I{} curl --silent --output /dev/null \
            --write-out '%{http_code}\n' "http://localhost:8000/patients?limit=5" \
            | sort | uniq -c | tee codes.txt
          test "$(grep -vc ' 200$' codes.txt)" -eq 0
      - name: API container logs
        if: always()
        run: docker logs api

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan every commit, not just the latest
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan git history
        # --redact keeps any finding's value out of the public CI log.
        run: ./gitleaks git --redact --verbose .
