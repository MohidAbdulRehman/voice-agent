# Local Postgres 16 for development and the test suite: docker compose up -d db
#
# Databases:
#   intake        local development (point DATABASE_URL here to avoid Supabase)
#   intake_test   owned by the test suite (TEST_DATABASE_URL); tests reset it
#
# Published on 127.0.0.1:5433, not 5432, so it can't collide with another
# Postgres on the machine and isn't reachable from the network.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intake
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intake"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
